[project]
name = "vaultdesk"
authors = [
    { name = "VaultDesk Contributors", email = "developer@example.com" }
]
description = "Secure internal document management module for Frappe and ERPNext"
requires-python = ">=3.10"
readme = "README.md"
dynamic = ["version"]
dependencies = []

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.bench.frappe-dependencies]
frappe = ">=15.104.0,<16.0.0"

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.flit.module]
name = "vaultdesk"

[tool.flit.sdist]
include = [
    "vaultdesk/**",
    "docs/**",
    "README.md",
    "license.txt",
]
