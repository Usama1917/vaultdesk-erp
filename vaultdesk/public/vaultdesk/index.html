<!doctype html>
<html lang="en" class="vaultdesk-preview-document">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<title>VaultDesk</title>
		<link rel="icon" href="data:,">
		<link rel="stylesheet" href="./vaultdesk.css?v=warm-editorial-rubik-20260614e">
	</head>
	<body class="vaultdesk-preview-body">
		<div id="vaultdesk-preview" class="vaultdesk-mount vaultdesk-standalone" aria-live="polite"></div>
		<script type="module">
			const mount = document.querySelector("#vaultdesk-preview");
			const parameters = new URLSearchParams(window.location.search);
			const language = (() => {
				try {
					return parameters.get("lang") === "ar" || window.localStorage.getItem("vaultdesk-language") === "ar"
						? "ar"
						: "en";
				} catch (error) {
					return parameters.get("lang") === "ar" ? "ar" : "en";
				}
			})();
			const startupText = language === "ar" ? {
				loading: "جار تحميل المعاينة المحلية...",
				title: "تعذر تشغيل VaultDesk",
				message: "أعد تحميل الصفحة للحصول على أحدث ملفات المعاينة المحلية.",
				reload: "إعادة تحميل المعاينة",
			} : {
				loading: "Loading local preview...",
				title: "VaultDesk could not start",
				message: "Reload the page to retrieve the latest local preview files.",
				reload: "Reload preview",
			};

			document.documentElement.lang = language;
			document.documentElement.dir = language === "ar" ? "rtl" : "ltr";
			mount.innerHTML = `
				<div class="data-startup" role="status">
					<span class="data-spinner" aria-hidden="true"></span>
					<strong>VaultDesk</strong>
					<p></p>
				</div>`;
			mount.querySelector(".data-startup p").textContent = startupText.loading;

			// This bootstrap copy stays independent of app modules so import failures remain visible.
			function showStartupFailure(error) {
				console.error("[VaultDesk preview] Startup failed.", error);
				const state = document.createElement("div");
				state.className = "data-startup is-error";
				state.setAttribute("role", "alert");
				const title = document.createElement("strong");
				const message = document.createElement("p");
				const reload = document.createElement("button");
				title.textContent = startupText.title;
				message.textContent = startupText.message;
				reload.className = "data-btn data-btn-primary";
				reload.type = "button";
				reload.textContent = startupText.reload;
				reload.addEventListener("click", () => window.location.reload());
				state.append(title, message, reload);
				mount.replaceChildren(state);
			}

			async function startPreview() {
				const module = await import("./app.js?v=warm-editorial-rubik-20260614e");

				// Local preview only: this entry always uses browser-memory fixtures, never ERP/Frappe APIs.
				const app = module.mountVaultDesk(mount, { apiMode: "mock" });
				if (await app.ready === false) return;

				if (parameters.has("permissions")) {
					const designs = app.state.items.find((item) => item.name === "projects");
					if (designs) app.share(designs);
				}
				if (parameters.has("preview")) {
					const fileName = parameters.get("preview") || "config";
					const item = app.api.items?.[fileName];
					if (item) app.preview(app.api.clone(fileName));
				}
				if (parameters.has("versions")) {
					const fileName = parameters.get("versions") || "invoice";
					const item = app.api.items?.[fileName];
					if (item) app.openVersions(app.api.clone(fileName));
				}
				if (parameters.has("context")) {
					const targetName = parameters.get("context") || "canvas";
					if (["file", "breadcrumb", "readonly"].includes(targetName)) {
						await app.openFolder(targetName === "readonly" ? "shared" : "production");
					}
					const selector = {
						canvas: '[data-region="drop-surface"]',
						folder: '[data-region="items"] [data-context-item="projects"]',
						tree: '[data-region="tree"] [data-context-item="projects"]',
						breadcrumb: '[data-region="breadcrumbs"] [data-context-item="production"]',
						file: '[data-region="items"] [data-context-item="notes"]',
						readonly: '[data-region="items"] [data-context-item="restricted"]',
					}[targetName];
					const target = selector && document.querySelector(selector);
					if (target) {
						target.dispatchEvent(new MouseEvent("contextmenu", {
							bubbles: true,
							cancelable: true,
							clientX: 260,
							clientY: 230,
						}));
					}
				}
			}

			startPreview().catch(showStartupFailure);
		</script>
	</body>
</html>
